services:
  payload:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/site_cm_payload}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:-build_time_secret_replace_at_runtime}
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/site_cm_payload}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media:/app/public/media

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-site_cm_payload}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-site_cm_payload}']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  media:
